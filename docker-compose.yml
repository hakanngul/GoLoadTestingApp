# Master on a single host (local dev or the AWS master instance). Data is
# kept in a SQLite file in the goload-data volume (/data/goload.db); no
# database server is needed. For PostgreSQL instead, add the override:
#
#   cp deploy/env.example .env   # then fill in the secrets
#   docker compose up -d --build
#   # with PostgreSQL:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d --build
#
# UI/API: http://localhost:8080   gRPC (workers): localhost:9090
# Backups: see "Data and backups" in README.md.
name: goload

services:
  master:
    image: ${GOLOAD_IMAGE:-goloadtest:local}
    build:
      context: .
      args:
        VERSION: ${GOLOAD_VERSION:-dev}
    restart: unless-stopped
    command: ["serve"]
    # Lets graceful shutdown finish active runs and checkpoint the database.
    stop_grace_period: 40s
    environment:
      GOLOAD_ADDR: ":8080"
      GOLOAD_DB: sqlite:/data/goload.db
      # Delete finished runs older than this (e.g. 90d); 0 = keep forever.
      GOLOAD_RETENTION: ${GOLOAD_RETENTION:-0}
      # Bearer token for the REST API / UI. Empty disables auth: never do
      # that on a reachable host.
      GOLOAD_TOKEN: ${GOLOAD_TOKEN:?set GOLOAD_TOKEN in .env}
      # Shared secret workers present on the gRPC port.
      GOLOAD_WORKER_TOKEN: ${GOLOAD_WORKER_TOKEN:?set GOLOAD_WORKER_TOKEN in .env}
      # Hosts runs may send load to (required): only systems you own or
      # have written permission to test. e.g. api.example.com,*.staging.example.com
      GOLOAD_ALLOWED_TARGETS: ${GOLOAD_ALLOWED_TARGETS:?set GOLOAD_ALLOWED_TARGETS in .env}
      # --- AWS worker provisioning (see docs/aws.md). none = use only
      # workers that connect on their own.
      GOLOAD_PROVISIONER: ${GOLOAD_PROVISIONER:-none}
      GOLOAD_MASTER_ADVERTISE_ADDR: ${GOLOAD_MASTER_ADVERTISE_ADDR:-}
      GOLOAD_WORKER_IMAGE: ${GOLOAD_WORKER_IMAGE:-}
      GOLOAD_AWS_REGION: ${GOLOAD_AWS_REGION:-}
      GOLOAD_AWS_LAUNCH_TEMPLATE_ID: ${GOLOAD_AWS_LAUNCH_TEMPLATE_ID:-}
      GOLOAD_AWS_SUBNET_IDS: ${GOLOAD_AWS_SUBNET_IDS:-}
      GOLOAD_AWS_INSTANCE_TYPES: ${GOLOAD_AWS_INSTANCE_TYPES:-c7i.large,c6i.large,c5.large}
      GOLOAD_AWS_SPOT_ONLY: ${GOLOAD_AWS_SPOT_ONLY:-false}
      GOLOAD_AWS_MAX_PRICE: ${GOLOAD_AWS_MAX_PRICE:-}
    volumes:
      - goload-data:/data
    ports:
      - "${GOLOAD_HTTP_PORT:-8080}:8080"
      - "${GOLOAD_GRPC_PORT:-9090}:9090"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  goload-data:
